<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>アクセスマップ - コンポーネント確認</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --color-primary: #1a97b2;
        --color-secondary: #ffeb3b;
        --color-accent: #ff9800;
        --color-foreground: #333333;
        --color-background: #f5f5f5;
        --color-surface: #ffffff;
        --color-border: #e0e0e0;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell',
          'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        background-color: var(--color-background);
        color: var(--color-foreground);
        padding: 2rem;
      }

      .container {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 2rem;
        background-color: var(--color-surface);
        border-radius: 0.5rem;
      }

      .title {
        display: inline-flex;
        gap: 0.5rem;
        align-items: center;
        margin: 0 0 1.5rem 0;
        font-size: 1.75rem;
        font-weight: 600;
        line-height: 1.2;
        color: var(--color-foreground);
      }

      .title::after {
        display: inline-block;
        flex-shrink: 0;
        width: 0;
        height: 0;
        content: '';
        border-top: 6px solid transparent;
        border-bottom: 6px solid transparent;
        border-left: 8px solid var(--color-accent);
        margin-left: 0.25rem;
      }

      .content {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2rem;
        align-items: start;
      }

      .mapWrapper {
        width: 100%;
        aspect-ratio: 1;
        overflow: hidden;
        background-color: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: 0.5rem;
      }

      .mapImage {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .box {
        position: relative;
        z-index: 1;
        padding: 1.5rem;
        overflow: hidden;
        background-color: var(--color-background);
        border-radius: 0.5rem;
        box-shadow: -4px 4px 12px rgba(26, 151, 178, 0.3);
      }

      .box::before {
        position: absolute;
        top: 0;
        right: 0;
        width: 40px;
        height: 100%;
        pointer-events: none;
        content: '';
        background: repeating-linear-gradient(
          90deg,
          var(--color-secondary) 0,
          var(--color-secondary) 10px,
          #ccaa00 10px,
          #ccaa00 20px
        );
      }

      .box::after {
        position: absolute;
        right: 0;
        bottom: 0;
        width: 40px;
        height: 8px;
        pointer-events: none;
        content: '';
        background-color: var(--color-accent);
      }

      .description {
        position: relative;
        z-index: 2;
        margin: 0;
        font-size: 0.875rem;
        line-height: 1.6;
        color: var(--color-foreground);
      }

      .description p {
        margin: 0.75rem 0;
      }

      .description strong {
        font-weight: 600;
      }

      .description ul {
        padding-left: 1.25rem;
        margin: 0.5rem 0;
      }

      .description li {
        margin: 0.25rem 0;
      }

      /* レスポンシブ対応 */
      @media (width <= 768px) {
        .container {
          padding: 1.5rem;
        }

        .title {
          font-size: 1.5rem;
        }

        .content {
          grid-template-columns: 1fr;
          gap: 1.5rem;
        }

        .mapWrapper {
          min-height: 300px;
          aspect-ratio: auto;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2 class="title">ACCESS</h2>
      <div class="content">
        <div class="mapWrapper">
          <img src="./2026_アクセスマップ.svg" alt="アクセスマップ" class="mapImage" />
        </div>
        <div class="box">
          <div class="description">
            <p><strong>電車をご利用の場合</strong></p>
            <ul>
              <li>JR山手線「赤坂見附」西ロビ口より1094</li>
              <li>東京メトロ丸ノ内線・赤坂見附駅「赤坂溜池山王」2階出口徒歩125分</li>
            </ul>
            <p><strong>バスをご利用の場合</strong></p>
            <ul>
              <li>国際展覧バス</li>
              <li>「赤坂三丁目」バス停下車 徒歩約2分</li>
              <li>「法曹会館」バス停下車 徒歩約30分（正門まで約250m）</li>
            </ul>
            <p><strong>ご来場について</strong></p>
            <ul>
              <li>
                キャンパス内に来来用の駐車場はございませんので、駐車場は専用駐車場をご利用ください。
              </li>
              <li>駐輪場も数台限られているすでにご了承願います。</li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
