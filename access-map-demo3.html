<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>アクセスマップ</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --color-primary: #68cce9;
        --color-accent: #f49847;
        --color-bg-cyan: #64cce3;
        --color-box-bg: #f5f5ea;
        --color-foreground: #333333;
        --color-surface: transparent;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell',
          'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        background-color: #f7f5e8;
        color: var(--color-foreground);
        padding: 2rem;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .container {
        width: 100%;
        max-width: 960px;
        margin: 0 auto;
        padding: 2rem 1rem;
      }

      /* タイトル部 */
      .title {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        margin-bottom: 2.5rem;
        font-size: 3.2rem;
        font-weight: 700;
        font-style: italic;
        line-height: 1;
        color: #1a1a1a;
        letter-spacing: 0.02em;
      }

      .arrows {
        display: inline-flex;
        align-items: center;
        gap: -10px;
        margin-left: 0.1rem;
      }

      .arrow {
        display: inline-block;
        width: 38px;
        height: 38px;
        border-top: 9.5px solid #f89846;
        border-right: 9.5px solid #f89846;
        transform: rotate(45deg);
        border-radius: 2px;
      }
      .content {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 3.5rem;
        align-items: stretch;
      }

      /* 左側マップ */
      .mapWrapper {
        width: 100%;
        aspect-ratio: 1;
        overflow: hidden;
        background-color: #ffffff;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      }

      .mapImage {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* 右側カードコンテナ */
      .cardWrapper {
        position: relative;
        height: 100%;
        padding-bottom: 10px;
        padding-right: 20px;
        box-sizing: border-box;
      }

      /* 右下の水色背景 */
      .cyanBg {
        position: absolute;
        top: 25px;
        left: 25px;
        right: -0px;
        bottom: -10px;
        background-color: var(--color-bg-cyan);
        z-index: 0;
      }

      /* カード本体（外枠） */
      .box {
        position: relative;
        z-index: 1;
        height: 100%;
        background-color: var(--color-box-bg);
        padding: 12px; /* ストライプ枠の厚み */
        /* 斜めストライプの枠線 */
        background-image: repeating-linear-gradient(
          -45deg,
          #e2df60,
          #e2df60 12px,
          #e3e489 12px,
          #e3e489 24px
        );
      }

      /* カード内側のコンテンツ領域 */
      .box-inner {
        background-color: var(--color-box-bg);
        padding: 1.8rem 1.8rem 1.2rem 1.8rem;
        position: relative;
        z-index: 2;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      /* 右下のオレンジストライプアクセント */
      .stripeAccent {
        position: absolute;
        bottom: 20px;
        right: -50px;
        width: 60px;
        height: 100px;
        z-index: 3;
        pointer-events: none;
      }

      .stripe {
        position: absolute;
        width: 45px;
        height: 8.5px;
        background-color: var(--color-accent);
        transform: rotate(-45deg);
        border-radius: 2px;
      }

      .stripe:nth-child(1) {
        top: 10px;
        right: 40px;
      }

      .stripe:nth-child(2) {
        top: 35px;
        right: 40px;
      }

      .stripe:nth-child(3) {
        top: 60px;
        right: 40px;
      }

      /* 説明文 */
      .description {
        font-size: 0.85rem;
        line-height: 1.5;
        color: #333333;
      }

      .description p {
        margin-top: 0.8rem;
        margin-bottom: 0.2rem;
        font-weight: bold;
        color: #222;
      }

      .description p:first-child {
        margin-top: 0;
      }

      .description ul {
        list-style: none;
        padding-left: 0;
        margin: 0;
      }

      .description li {
        position: relative;
        padding-left: 0.9rem;
        margin: 0.15rem 0;
      }

      .description li::before {
        content: '・';
        position: absolute;
        left: 0;
      }

      /* GoogleMapボタン */
      .btn-wrapper {
        text-align: right;
        margin-top: 1rem;
      }

      .map-btn {
        display: inline-block;
        background-color: #eced4b;
        color: #000;
        padding: 0.45rem 1.5rem;
        border-radius: 0.5rem;
        border: 1.5px solid #000;
        font-weight: bold;
        font-size: 1rem;
        text-decoration: none;
        box-shadow: 2px 2px 0px #68cce9;
        transition:
          transform 0.1s,
          box-shadow 0.1s;
      }

      .map-btn:hover {
        transform: translate(1px, 1px);
        box-shadow: 1px 1px 0px rgba(0, 0, 0, 0.15);
      }

      /* レスポンシブ対応 */
      @media (max-width: 768px) {
        .container {
          padding: 1rem;
        }

        .title {
          font-size: 2.2rem;
        }

        .content {
          grid-template-columns: 1fr;
          gap: 2.5rem;
        }

        .cardWrapper {
          height: auto;
        }

        .cyanBg {
          top: 15px;
          left: 15px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2 class="title">
        ACCESS
        <span class="arrows">
          <span class="arrow"></span>
          <span class="arrow"></span>
          <span class="arrow"></span>
        </span>
      </h2>
      <div class="content">
        <div class="mapWrapper">
          <img src="./2026_アクセスマップ.svg" alt="アクセスマップ" class="mapImage" />
        </div>

        <div class="cardWrapper">
          <div class="cyanBg"></div>
          <div class="box">
            <div class="box-inner">
              <div class="description">
                <p>電車をご利用の場合</p>
                <ul>
                  <li>JR各線「赤羽駅」西口徒歩10分</li>
                  <li>東京メトロ南北線・埼玉高速鉄道線<br />「赤羽岩淵駅」2番出口徒歩12分</li>
                </ul>

                <p>バスをご利用の場合</p>
                <ul>
                  <li>国際興業バス</li>
                  <li>「赤羽台三丁目」バス停下車 徒歩約2分</li>
                  <li>「法善寺交番」バス停下車 徒歩約3分（正門まで約250m）</li>
                </ul>

                <p>ご来校にあたって</p>
                <ul>
                  <li>
                    キャンパス内に来客用の駐車場はございません。駐輪場も数が限られていますので公共交通機関をご利用いただきますようお願いいたします。
                  </li>
                </ul>
              </div>

              <div class="btn-wrapper">
                <a href="#" class="map-btn" target="_blank" rel="noopener noreferrer">GoogleMap</a>
              </div>
            </div>
          </div>
          <div class="stripeAccent">
            <span class="stripe"></span>
            <span class="stripe"></span>
            <span class="stripe"></span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
